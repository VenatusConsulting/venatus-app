<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venatus — Mines IG</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .mine-card {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    .mine-card:hover { border-color: #667eea44; }
    .mine-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .mine-compte {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }
    .mine-compte:hover { color: #667eea; }
    .mine-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .mine-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text3);
    }
    .mine-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .mine-statut-pills { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .mine-pill {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      background: transparent;
    }
    .mine-leads-counter {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 6px 10px;
      width: fit-content;
    }
    .mine-leads-counter button {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      width: 24px;
      height: 24px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .mine-leads-counter button:hover { background: #667eea33; border-color: #667eea; }
    .mine-leads-num {
      font-size: 16px;
      font-weight: 700;
      color: var(--green);
      min-width: 24px;
      text-align: center;
    }
    .mine-notes {
      font-size: 12px;
      color: var(--text3);
      margin-top: 8px;
      font-style: italic;
      border-top: 1px solid var(--border2);
      padding-top: 8px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-count {
      background: var(--bg3);
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
    }
    .popup-box {
      background: #0d0d1a;
      border: 1px solid #2a2a45;
      border-radius: 16px;
      padding: 28px;
      width: 400px;
      max-width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .popup-title {
      font-size: 16px;
      font-weight: 700;
      color: #e0e0ff;
      margin-bottom: 20px;
    }
    .popup-field { margin-bottom: 14px; }
    .popup-label {
      font-size: 11px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .popup-input {
      width: 100%;
      background: #0f0f1e;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e0e0ff;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }
    .popup-input:focus { border-color: #667eea; }
    .popup-select {
      width: 100%;
      background: #0f0f1e;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e0e0ff;
      font-size: 13px;
      outline: none;
    }
    .popup-textarea {
      width: 100%;
      background: #0f0f1e;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e0e0ff;
      font-size: 13px;
      outline: none;
      resize: vertical;
      min-height: 70px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .popup-btn-row { display: flex; gap: 8px; margin-top: 20px; }
    .popup-cancel {
      flex: 1;
      background: #0f0f1e;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      padding: 10px;
      color: #555;
      font-size: 13px;
      cursor: pointer;
    }
    .popup-confirm {
      flex: 2;
      background: linear-gradient(135deg,#667eea,#764ba2);
      border: none;
      border-radius: 8px;
      padding: 10px;
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">💎 Venatus</div>
    <nav class="sidebar-nav">
      <a href="index.html"    class="sidebar-link"><span>📊</span> Dashboard</a>
      <a href="leads.html"    class="sidebar-link"><span>👤</span> Leads</a>
      <a href="relances.html" class="sidebar-link"><span>⏰</span> Relances</a>
      <a href="pipeline.html" class="sidebar-link"><span>📋</span> Pipeline</a>
      <a href="mines.html"    class="sidebar-link active"><span>⛏️</span> Mines</a>
      <a href="stats.html"    class="sidebar-link"><span>📈</span> Stats Perf</a>
    </nav>
  </aside>

  <div class="main-wrap">
    <div class="main-content">
      <div class="page-header">
        <h1>⛏️ Mines IG</h1>
        <button id="btn-add-mine" class="btn-primary">➕ Ajouter une mine</button>
      </div>

      <div class="kpi-grid" id="mines-kpis"></div>

      <div class="filters-bar" style="margin-top:16px;">
        <select id="filter-statut">
          <option value="tous">Tous les statuts</option>
          <option value="a_faire">🔵 À faire</option>
          <option value="en_cours">🟡 En cours</option>
          <option value="epuise">⚫ Épuisé</option>
        </select>
        <select id="filter-niche">
          <option value="">Toutes les niches</option>
          <option value="influenceuse">💋 Influenceuse</option>
          <option value="fitness">💪 Fitness</option>
          <option value="gaming">🎮 Gaming</option>
          <option value="cosplay">🎨 Cosplay</option>
        </select>
      </div>

      <div id="mines-list" style="margin-top:8px;"></div>
    </div>
  </div>

  <!-- Popup ajout -->
  <div id="add-popup" class="popup-overlay hidden">
    <div class="popup-box">
      <div class="popup-title">➕ Nouvelle mine</div>
      <div class="popup-field">
        <div class="popup-label">Compte Instagram *</div>
        <input type="text" id="new-compte" class="popup-input" placeholder="@pseudo ou URL instagram.com/...">
      </div>
      <div class="popup-field">
        <div class="popup-label">Niche</div>
        <select id="new-niche" class="popup-select">
          <option value="">— Choisir —</option>
          <option value="influenceuse">💋 Influenceuse</option>
          <option value="fitness">💪 Fitness</option>
          <option value="gaming">🎮 Gaming</option>
          <option value="cosplay">🎨 Cosplay</option>
        </select>
      </div>
      <div class="popup-field">
        <div class="popup-label">Comment tu l'as trouvé</div>
        <select id="new-source" class="popup-select">
          <option value="">— Choisir —</option>
          <option value="dork">🔍 Google Dorking</option>
          <option value="abonnements">👥 Abonnements d'une modèle</option>
          <option value="reels">🎬 Reels Instagram</option>
          <option value="tiktok">🎵 TikTok</option>
          <option value="manuel">✋ Manuel</option>
        </select>
      </div>
      <div class="popup-field">
        <div class="popup-label">Notes</div>
        <textarea id="new-notes" class="popup-textarea" placeholder="Niche dominante, qualité estimée..."></textarea>
      </div>
      <div class="popup-btn-row">
        <button class="popup-cancel" id="btn-cancel-add">Annuler</button>
        <button class="popup-confirm" id="btn-confirm-add">⛏️ Ajouter la mine</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { checkAuth, addSignOutButton } from "./firebase-auth.js";
    import "./mines-init.js";
    checkAuth(() => {
      addSignOutButton();
      window.initMines();
    });
  </script>
</body>
</html>
