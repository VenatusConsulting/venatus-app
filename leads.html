<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venatus — Leads</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b0f22">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">💎 Venatus</div>
    <nav class="sidebar-nav">
  <a href="index.html"    class="sidebar-link"><span>📊</span> Dashboard</a>
  <a href="leads.html"    class="sidebar-link"><span>👤</span> Leads</a>
  <a href="relances.html" class="sidebar-link"><span>⏰</span> Relances</a>
  <a href="pipeline.html" class="sidebar-link"><span>📋</span> Pipeline</a>
  <a href="mines.html"    class="sidebar-link"><span>⛏️</span> Mines</a>
  <a href="comptes.html"  class="sidebar-link"><span>📱</span> Par compte</a>
  <a href="stats.html"    class="sidebar-link"><span>📈</span> Stats Perf</a>
</nav>
  </aside>

  <div class="main-wrap">
    <div class="main-content">
      <div class="page-header">
        <h1>Leads</h1>
        <span id="leads-total" class="badge">—</span>
      </div>
      <div class="filters">
        <input type="text" id="search" placeholder="🔍 Rechercher un pseudo..." class="search-input">
        <select id="filter-statut" class="filter-select">
          <option value="tous">Tous les statuts</option>
          <option value="nouveau">🆕 Nouveau</option>
          <option value="contacte">📨 Contacté</option>
          <option value="en_discussion">💬 En discussion</option>
          <option value="signe">✅ Signé</option>
          <option value="refus">❌ Refus</option>
          <option value="ghosted">👻 Ghosted</option>
        </select>
        <select id="filter-niche" class="filter-select">
          <option value="">Toutes les niches</option>
          <option value="influenceuse">💋 Influenceuse</option>
          <option value="fitness">💪 Fitness</option>
          <option value="gaming">🎮 Gaming</option>
          <option value="cosplay">🎨 Cosplay</option>
        </select>
        <select id="filter-compte" class="filter-select">
          <option value="">Tous les comptes</option>
        </select>
      </div>
      <div class="card">
        <div id="leads-list" class="leads-list">
          <div class="loading">Chargement...</div>
        </div>
        <div class="pagination">
          <button id="prev-btn" class="btn-page" disabled>← Précédent</button>
          <span id="page-info">Page 1</span>
          <button id="next-btn" class="btn-page">Suivant →</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-pseudo">—</h2>
        <button onclick="closeModal()" class="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module">
    import { checkAuth, addSignOutButton } from "./firebase-auth.js";
    import "./leads-init.js";
    checkAuth(() => {
      addSignOutButton();
      window.initLeads();
    });
  </script>
</body>
</html>
